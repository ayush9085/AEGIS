name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit and integration tests
        run: python -m pytest -v

      - name: Lint with Ruff
        run: ruff check .

      - name: Build distribution packages (sdist and wheel)
        run: python -m build

      - name: Test installation from built wheel
        run: |
          python -m venv /tmp/isolated_test_env
          /tmp/isolated_test_env/bin/pip install dist/*.whl
          /tmp/isolated_test_env/bin/aegis --help
          /tmp/isolated_test_env/bin/aegis doctor
          rm -rf /tmp/isolated_test_env

      - name: Run synthetic end-to-end demo and verify reproducibility
        run: ./scripts/demo.sh

      - name: Verify repository hygiene
        run: |
          # Confirm working tree has no untracked build junk or secrets
          git status --porcelain
          test -z "$(git status --porcelain)"
